name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libnotify-dev \
            libcanberra-dev \
            libx11-dev \
            libwayland-dev \
            libegl-dev \
            libgl-dev \
            libfontconfig-dev \
            libonig-dev \
            xdotool \
            x11-xkb-utils \
            xvfb

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: Codex wrapper tests
        run: python3 -m unittest discover -s tests -v

      - name: E2E tests
        run: xvfb-run zig build e2e

      - name: Ghostty embedding tests
        run: xvfb-run python3 -m unittest discover -s tests -p 'test_ghostty_integration.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance

      - name: Keyboard remap tests
        run: python3 -m unittest discover -s tests -p 'test_keyboard_remaps.py' -v
        env:
          SEANCE_TEST_BINARY: ${{ github.workspace }}/zig-out/bin/seance
